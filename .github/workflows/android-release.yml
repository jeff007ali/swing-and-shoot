# Builds the Android APK on GitHub and attaches it to a GitHub Release (docs/release.md).
#
# Push a version tag to make a release:   git tag v0.2.0 && git push origin v0.2.0
# The newest APK is then always at:
#   https://github.com/<owner>/<repo>/releases/latest/download/swing-and-shoot.apk
# Run it from the Actions tab (workflow_dispatch) to get a test APK as a build artifact, with no release.
#
# Needs three repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64    the release keystore, base64-encoded
#   ANDROID_KEYSTORE_ALIAS     its key alias
#   ANDROID_KEYSTORE_PASSWORD  its password
# Every APK is signed with that same key, so testers can install each new build over the last one.

name: Android APK release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"
  APK_NAME: swing-and-shoot.apk

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot and its export templates
        run: |
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          TEMPLATES="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATES"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mv templates/* "$TEMPLATES/"
          rm -rf templates ./*.zip ./*.tpz

      - name: Point Godot at the Android SDK and Java
        run: |
          # GitHub's Ubuntu runners come with the Android SDK; Godot also wants a debug keystore to exist.
          KEYSTORES="$HOME/.local/share/godot/keystores"
          mkdir -p "$KEYSTORES" "$HOME/.config/godot"
          keytool -genkeypair -keystore "$KEYSTORES/debug.keystore" -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
          GODOT_MINOR="${GODOT_VERSION%.*}"
          cat > "$HOME/.config/godot/editor_settings-${GODOT_MINOR}.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "$KEYSTORES/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
          sed -i 's/^ *//' "$HOME/.config/godot/editor_settings-${GODOT_MINOR}.tres"

      - name: Set the version from the tag
        run: |
          # v0.2.0 -> version name 0.2.0. The version code (Android's "is this newer?" number) is the
          # workflow run number, so it always goes up.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then NAME="${GITHUB_REF_NAME#v}"; else NAME="0.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/; s/^version\/name=.*/version\/name=\"${NAME}\"/" export_presets.cfg
          sed -i "s/^config\/version=.*/config\/version=\"${NAME}\"/" project.godot
          echo "Building version ${NAME} (code ${GITHUB_RUN_NUMBER})"

      - name: Import the project
        run: godot --headless --path . --import

      - name: Run the tests
        run: godot --headless --path . -s addons/gut/gut_cmdln.gd -gdir=res://tests -gexit

      - name: Export the signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_* secrets first (docs/release.md)."
            exit 1
          fi
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/release.keystore"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"
          mkdir -p build
          godot --headless --path . --export-release "Android" "build/${APK_NAME}"
          rm -f "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"
          ls -l build

      - name: Attach the APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/${{ env.APK_NAME }}
          generate_release_notes: true

      - name: Keep the APK as a build artifact (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: swing-and-shoot-apk
          path: build/${{ env.APK_NAME }}
